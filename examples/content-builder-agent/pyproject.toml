[project]
name = "content-builder-agent"
version = "0.1.0"
description = "A content writer agent using Agent-RT + OpenBox governance"
requires-python = ">=3.11,<3.15"
dependencies = [
    "agent-rt[openai]==0.0.3",
    "google-genai>=1.0.0",
    "openbox-agentrt-sdk-python>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "tavily-python>=0.5.0",
]

[dependency-groups]
dev = []

[tool.uv.sources]
openbox-agentrt-sdk-python = { path = "../..", editable = true }
