[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "openbox-agentrt-sdk-python"
version = "1.0.0"
description = "OpenBox governance and observability SDK for Agent-RT"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
dependencies = [
    # Governance infra (client, gate, runtime, approvals, instrumentation) comes
    # from the framework-neutral base SDK; Agent-RT supplies the agent runtime.
    "openbox-sdk-python>=1.4.0",
    "agent-rt==0.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["openbox_agentrt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# Agent-RT ships no py.typed marker.
module = ["agent_rt", "agent_rt.*"]
ignore_missing_imports = true
